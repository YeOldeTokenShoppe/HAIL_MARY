<title>R-cana Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* The first playtest: night-market table, papel-picado card types. One committed dark look. */
:root{
  --felt:#1b1430; --felt2:#241a40; --line:#4a3d6e; --ink:#efe6d0; --muted:#a899c9;
  --paper:#f3e9d2; --paper-ink:#2a2040; --gold:#e8b84b; --rose:#e4567b; --teal:#4fc3a1; --violet:#8d7bd8;
  --display:'Alfa Slab One','Arial Black',serif; --body:'Spectral',Georgia,serif;
  --cw: clamp(6.6rem, 5.6rem + 3vw, 8.8rem);
  color-scheme: dark;
}
body{background:var(--felt);color:var(--ink);font-family:var(--body);margin:0;font-size:clamp(0.95rem,0.85rem + 0.3vw,1.08rem);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.bar,.board,details.history{max-width:80rem;margin-inline:auto}
h1{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.3rem;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar select,.bar input{background:var(--felt2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:var(--body)}
button{background:var(--felt2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 14px;font-family:var(--body);font-size:.95rem;cursor:pointer}
button.primary{background:var(--gold);color:#2a2040;border-color:var(--gold);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.note{color:var(--muted);font-size:.85rem}
.board{display:grid;gap:1rem}
.rivals{display:grid;gap:0.8rem;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.panel{border:1px solid var(--line);border-radius:0.8rem;padding:0.9rem;background:var(--felt2);min-width:0}
.panel.me{border-color:var(--gold)}
.phead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.phead .who{font-family:var(--display);font-size:.95rem}
.phead .who.active{color:var(--gold)}
.stat{font-size:.88rem;color:var(--muted)}.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.prosbar{height:0.55rem;border-radius:0.3rem;background:#0006;margin-top:6px;overflow:hidden}
.prosbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}
.candles{letter-spacing:.15em;color:var(--gold)}
.rowlabel{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.cards{display:flex;flex-wrap:wrap;gap:0.6rem;min-height:1.6rem;min-width:0}
.chip{font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.chip.haz{border-color:var(--rose);color:var(--rose)}
.card{width:var(--cw);min-height:calc(var(--cw)*1.06);border-radius:.55em;padding:.6em;display:flex;flex-direction:column;gap:4px;position:relative;
  background:var(--paper);color:var(--paper-ink);border:1px solid #0006;box-shadow:0 2px 6px #0007}
.card .nm{font-family:var(--display);font-size:.8em;line-height:1.15;padding-right:.2em;text-wrap:balance;overflow-wrap:anywhere}
.card .ty{font-size:.66em;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.card .fx{font-size:.7em;line-height:1.25;margin-top:auto;opacity:.9}
.card .chips{display:flex;gap:.35em;font-size:.72em;font-weight:600;flex-wrap:wrap}
.card .chips span{background:#2a204014;border-radius:4px;padding:1px 5px}
.card.hazard{background:linear-gradient(170deg,#6e3050,#542343);color:#ffe9f0;border-color:var(--rose)}
.card.remedy{background:linear-gradient(170deg,#2f6b58,#1f4e3f);color:#eafff5;border-color:var(--teal)}
.card.artifact{background:linear-gradient(170deg,#5e4a9e,#473579);color:#f3edff;border-color:var(--violet)}
.card.coop,.card.lady{background:linear-gradient(170deg,#e8b84b,#d9a02e);color:#2a2040}
.card.playable{cursor:pointer;outline:2px solid transparent;transition:outline-color .15s,transform .15s}
.card.playable:hover{outline-color:var(--gold);transform:translateY(-2px)}
.card.dim{opacity:.55}
.actionbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#0a0618d9;padding:18px}
.box{background:var(--felt2);border:1px solid var(--gold);border-radius:14px;padding:22px;max-width:540px;width:100%;display:grid;gap:12px;max-height:85dvh;overflow:auto}
.box .call{font-family:var(--display);font-size:1.7rem;color:var(--gold);text-wrap:balance}
.box .kind{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
details.history{margin-top:14px}summary{color:var(--muted);cursor:pointer}
.log{font-size:.8rem;max-height:220px;overflow:auto;display:grid;gap:2px;margin-top:8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--gold);color:#2a2040;font-weight:600;border-radius:7px;padding:9px 15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
</style>

<div class="bar">
  <h1>R-CANA · FIRST PLAYTEST</h1>
  <select id="meT"></select>
  <select id="nBots"><option value="2">2 rivals</option><option value="3">3 rivals</option></select>
  <label class="note">Seed <input id="seed" type="number" value="7" min="1" style="width:66px"></label>
  <button class="primary" id="deal">Deal</button>
  <span class="note" id="status">Pick a Trader, press Deal. First to bank 1,000 Prosperity wins.</span>
</div>
<div class="board" id="board" hidden>
  <section class="rivals" id="rivals"></section>
  <section class="panel me">
    <div class="phead"><span class="who" id="meWho">YOU</span><span class="stat">Liquidity <b id="meLiq">0</b></span><span class="stat">Prosperity <b id="mePros">0</b> / 1000</span><span class="stat">Deeds <b class="candles" id="meDeeds"></b></span><span class="stat" id="meHail"></span><span class="stat" id="meHaz"></span></div>
    <div class="prosbar"><i id="meBar" style="width:0%"></i></div>
    <div class="rowlabel">Your investments · tap to sell (not the turn they arrive)</div><div class="cards" id="meInvest"></div>
    <div style="display:flex;gap:1.2rem;flex-wrap:wrap">
      <div style="min-width:0"><div class="rowlabel">Artifacts (max 2)</div><div class="cards" id="meArts"></div></div>
      <div style="min-width:0"><div class="rowlabel">Hazards on you</div><div class="cards" id="meHazards"></div></div>
    </div>
    <div class="rowlabel">Your hand · one main action a turn</div><div class="cards" id="meHand"></div>
    <div class="rowlabel" style="margin-top:12px">At the table</div><div id="feed" class="note" style="display:grid;gap:2px;min-height:3.2em"></div>
    <div class="actionbar">
      <b class="stat" id="turnNote"></b>
      <button id="giftBtn">Give 2 Liquidity (deed)</button>
      <button id="hailBtn">Hail Mary</button>
      <button id="cycleBtn">Cycle a card</button>
      <button id="passBtn">Pass</button>
      <span class="stat">Deck <b id="meDeck">0</b> · Discard <b id="meDisc">0</b></span>
    </div>
  </section>
</div>
<details class="history" id="hist" hidden><summary>Table history</summary><div class="log" id="log"></div></details>
<div id="overlayHost"></div><div class="toast" id="toast"></div>

<script type="module">
/*__ENGINE__*/

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const FX = { tech: 'Sell later: 5 Liquidity or 100 Prosperity', meme: 'Sell later: 4 Liquidity or 75 Prosperity', moon: 'Sell later: 7 Liquidity or 150 Prosperity', bull: 'Bank 100 Prosperity', rocket: 'Bank 200 Prosperity', inherit: 'Take 3 Liquidity, or bank 50 Prosperity', bear: 'Rival banks at most 75 from a single card', hack: 'Rival’s Trader ability is disabled', rug: 'Rival cannot sell Assets', bell: 'Clears The Bear', resist: 'Clears Quantum Hack', keys: 'Clears Rug Pull', tortilla: 'Clears any one hazard', heart: 'Discard to cancel a hazard just played on you', halo: 'Your Trader\u2019s ability cannot be disabled', xray: 'Once a turn, peek at a random rival card', rosary: 'Draw a card when you earn a deed', rose: 'Give a rival 2 Liquidity: a deed, then draw one', fountain: 'You and a rival each draw one: a deed' };
const TFX = { unicornio: 'Peek at your top card before drawing; keep or bottom it', marisol: 'Once a game, cancel a Rug Pull played on you', monje: '+1 Liquidity whenever you earn a deed', gato: 'Once a game, shrug off one hazard for free', diablito: '+1 Liquidity when your hazard lands', abuela: 'Your Remedies cost 1 less', celebridad: 'Pay 1 when banking from a card: +25 Prosperity' };
$('meT').innerHTML = TRADERS.map((t) => `<option value="${t.key}">You: ${esc(t.name)}</option>`).join('');

let S = null;
const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800); };

class HumanPolicy {
  main(g, p) { if (S.turnToasted !== g.turnNo) { S.turnToasted = g.turnNo; toast(`Round ${g.turnNo} · YOUR TURN — +2 Liquidity, one card drawn. Choose one main action.`); } return new Promise((res) => { S.mainResolve = res; render(); }); }
  discardOne(g, p) { return new Promise((res) => pickCard('Discard down to seven — tap a card to let go', p.hand, res)); }
  useHeart(g, p, c, by) { return ask(`${by.name} plays ${c.name} on you`, `Discard your SACRED HEART to cancel it?`, 'Cancel it', 'Take the hazard'); }
  useMarisol(g, p, c, by) { return ask(`${by.name} plays a Rug Pull on you`, 'Use LA DETECTIVE (once a game) to cancel it?', 'Cancel it', 'Take it'); }
  useGato(g, p) { return ask('EL GATO stretches', `Knock ${p.hazards[0].name} off the table for free (once a game)?`, 'Do it', 'Save the cat'); }
  peekBottom(g, p, top) { return ask('EL UNICORNIO peeks', `Top of your deck: ${top.name}. Send it to the bottom?`, 'Bottom it', 'Leave it'); }
}
const resolveMain = (a) => { const r = S.mainResolve; S.mainResolve = null; $('overlayHost').innerHTML = ''; render(); if (r) { toast(a && a.t === 'pass' ? 'You pass — your turn is over.' : 'That was your one main action — your turn is over.'); r(a); } };
function ask(kind, q, yes, no) { return new Promise((res) => { const host = $('overlayHost');
  host.innerHTML = `<div class="overlay"><div class="box"><div class="kind">${esc(kind)}</div><div>${esc(q)}</div><button class="primary" id="aYes">${esc(yes)}</button><button id="aNo">${esc(no)}</button></div></div>`;
  host.querySelector('#aYes').onclick = () => { host.innerHTML = ''; res(true); setTimeout(render, 30); };
  host.querySelector('#aNo').onclick = () => { host.innerHTML = ''; res(false); setTimeout(render, 30); }; }); }
function pickCard(title, cards, done) { const host = $('overlayHost');
  host.innerHTML = `<div class="overlay"><div class="box"><div class="kind">${esc(title)}</div><div class="cards" id="pickRow"></div></div></div>`;
  const row = host.querySelector('#pickRow');
  cards.forEach((c) => { const el = cardEl(c); el.classList.add('playable'); el.onclick = () => { host.innerHTML = ''; done(c); setTimeout(render, 30); }; row.appendChild(el); });
}
function popMenu(items) { if (!S.mainResolve) { toast('Your main action is spent — wait for your next turn.'); return; } const host = $('overlayHost');
  host.innerHTML = `<div class="overlay"><div class="box">${items.map((it, i) => `<button ${i === 0 ? 'class="primary"' : ''} data-i="${i}">${esc(it[0])}</button>`).join('')}<button data-i="-1">Never mind</button></div></div>`;
  host.querySelectorAll('button').forEach((b) => b.onclick = () => { const i = +b.dataset.i; host.innerHTML = ''; if (i >= 0) items[i][1](); });
  host.querySelector('.overlay').onclick = (e) => { if (e.target === e.currentTarget) host.innerHTML = ''; };
}
function cardEl(c) {
  const el = document.createElement('div'); el.className = 'card ' + (c.type === 'hazard' ? 'hazard' : c.type === 'remedy' ? 'remedy' : c.type === 'artifact' ? 'artifact' : c.type === 'coop' ? 'coop' : '');
  el.innerHTML = `<div class="nm">${esc(c.name)}</div><div class="ty">${esc(c.type)}</div><div class="chips"><span>cost ${c.cost}</span>${c.pros ? `<span>${c.pros}P</span>` : ''}${c.cash ? `<span>${c.cash}L</span>` : ''}</div><div class="fx">${esc(FX[c.key] || c.text || '')}</div>`;
  return el;
}
$('deal').onclick = async () => {
  if (S && S.running) return;
  const seed = +$('seed').value || 7; const rng = makeRng(seed * 13 + 5); const pool = [...TRADERS].sort(() => rng() - 0.5);
  const meT = TRADERS.find((t) => t.key === $('meT').value); pool.splice(pool.indexOf(meT), 1);
  const n = +$('nBots').value;
  const players = [ { name: 'YOU', policy: new HumanPolicy(), trader: meT },
    ...Array.from({ length: n }, (_, i) => ({ name: ['EL BOT', 'LA BOT', 'EL OTRO'][i], policy: new GreedyBot(), trader: pool.pop() })) ];
  const g = new Game({ players, seed, verbose: true });
  S = { g, me: g.players[0], running: true, mainResolve: null };
  g.hooks = { render: async () => { render(); if (g.active !== S.me) await sleep(520); } };
  $('board').hidden = false; $('hist').hidden = false; render();
  const r = await g.run(); S.running = false; render(); bell(r);
};
function bell(r) { const host = $('overlayHost'); const rows = S.g.players.map((q) => `<div>${esc(q.name)} · ${esc(q.t.name)} — <b>${q.pros}</b> Prosperity, ${q.deeds} deed${q.deeds === 1 ? '' : 's'}${q.hailUsed ? ', Hail Mary spent' : ''}</div>`).join('');
  host.innerHTML = `<div class="overlay"><div class="box"><div class="kind">the race is run · round ${r.turns}</div><div class="call">${r.winner === 'YOU' ? 'YOU WIN' : r.winner ? esc(r.winner) + ' WINS' : 'NO WINNER'}</div>${rows}<button class="primary" id="again">Deal again</button></div></div>`;
  host.querySelector('#again').onclick = () => { host.innerHTML = ''; $('deal').click(); };
}
function acts() { return S.mainResolve ? S.g.legalActions(S.me) : []; }
function render() {
  if (!S) return; const g = S.g, me = S.me; const mine = !!S.mainResolve; const A = acts();
  $('status').textContent = S.running ? `Round ${g.turnNo} · first to 1,000` : 'Game over.';
  // rivals
  const rv = $('rivals'); rv.innerHTML = '';
  for (const q of g.players) { if (q === me) continue;
    const d = document.createElement('section'); d.className = 'panel';
    d.innerHTML = `<div class="phead"><span class="who ${g.active === q && S.running ? 'active' : ''}">${esc(q.name)} · ${esc(q.t.name)}</span>
      <span class="stat">Liq <b>${q.liq}</b></span><span class="stat">Pros <b>${q.pros}</b></span><span class="stat">Hand <b>${q.hand.length}</b></span><span class="stat candles">${'🕯'.repeat(q.deeds)}</span><span class="stat">${q.hailUsed ? 'HM spent' : 'HM live'}</span></div>
      <div class="prosbar"><i style="width:${Math.min(100, q.pros / 10)}%"></i></div>
      <div style="margin-top:6px">${q.invest.map((a) => `<span class="chip">${esc(a.name)}</span>`).join(' ')} ${q.artifacts.map((a) => `<span class="chip">${esc(a.name)}</span>`).join(' ')} ${q.hazards.map((h) => `<span class="chip haz">${esc(h.name)}</span>`).join(' ')}</div>`;
    rv.appendChild(d);
  }
  // me
  $('meWho').textContent = 'YOU · ' + me.t.name; $('meWho').classList.toggle('active', mine && S.running);
  $('meWho').title = TFX[me.t.key] || '';
  $('meLiq').textContent = me.liq; $('mePros').textContent = me.pros; $('meBar').style.width = Math.min(100, me.pros / 10) + '%';
  $('meDeeds').textContent = '🕯'.repeat(me.deeds) || '—';
  const tw = ODDS[Math.min(3, me.deeds)]; $('meHail').textContent = me.hailUsed ? 'Hail Mary: spent' : `Hail Mary: ${tw}/12 to bank 200`;
  $('meHaz').textContent = g.abilityOn(me) ? '' : 'ABILITY HACKED';
  $('meDeck').textContent = me.deck.length; $('meDisc').textContent = me.discard.length;
  const inv = $('meInvest'); inv.innerHTML = '';
  me.invest.forEach((a) => { const el = cardEl(a); const sc = A.find((x) => x.t === 'sell' && x.a === a && !x.pros); const sp = A.find((x) => x.t === 'sell' && x.a === a && x.pros);
    const items = []; if (sc) items.push([`Sell for ${a.cash} Liquidity`, () => resolveMain(sc)]); if (sp) items.push([`Sell for ${a.pros} Prosperity`, () => resolveMain(sp)]);
    if (items.length) { el.classList.add('playable'); el.onclick = () => popMenu(items.reverse()); } else el.classList.add('dim'); inv.appendChild(el); });
  const ar = $('meArts'); ar.innerHTML = ''; me.artifacts.forEach((a) => ar.appendChild(cardEl(a)));
  const hz = $('meHazards'); hz.innerHTML = '';
  me.hazards.forEach((h) => { const el = cardEl(h); const pc = A.find((x) => x.t === 'payclear' && x.h === h);
    if (pc) { el.classList.add('playable'); el.onclick = () => popMenu([[`Pay 3 Liquidity to clear ${h.name}`, () => resolveMain(pc)]]); } hz.appendChild(el); });
  const mh = $('meHand'); mh.innerHTML = '';
  me.hand.forEach((c) => { const el = cardEl(c); const mineActs = A.filter((x) => x.t === 'play' && x.c === c);
    const items = mineActs.map((x) => { let label = `Play (${g.costOf(me, c)} Liq)`;
      if (c.type === 'hazard') label = `Play on ${x.choice.target.name}`;
      if (c.type === 'remedy') label = `Clear ${x.choice.hazard.name} ${x.choice.target === me ? 'on you' : 'on ' + x.choice.target.name + (x.choice.hazard.by !== me.idx && me.deeds < 3 ? ' (a deed)' : '')}`;
      if (c.type === 'coop') label = `${c.name} with ${x.choice.target.name}`;
      if (c.type === 'progress' && c.choice) label = x.choice.cash ? `Take ${c.cash} Liquidity` : `Bank ${c.pros} Prosperity`;
      return [label, () => resolveMain(x)]; });
    const cyc = A.find((x) => x.t === 'cycle'); if (mine && cyc) items.push(['Discard this, draw one', () => resolveMain({ t: 'cycle', c })]);
    if (items.length && mine) { el.classList.add('playable'); el.onclick = () => popMenu(items); } else el.classList.add('dim');
    mh.appendChild(el); });
  $('turnNote').textContent = mine ? 'YOUR TURN · choose one main action:' : S.running ? (g.active && g.active !== me ? 'Turn over · ' + g.active.name + ' is playing…' : '') : '';
  $('giftBtn').disabled = !mine || me.liq < 2 || me.deeds >= 3 || me.deedThisTurn;
  $('giftBtn').onclick = () => popMenu(g.rivals(me).map((r) => [`Give 2 Liquidity to ${r.name}`, () => resolveMain({ t: 'gift', target: r })]));
  const hailAct = A.find((x) => x.t === 'hail');
  $('hailBtn').disabled = !mine || !hailAct;
  $('hailBtn').onclick = () => ask('once per game', `Attempt the Hail Mary at ${tw}/12? Answered: your hazards clear and you bank 200.`, 'Pray', 'Hold').then((y) => { if (y) { resolveMain(hailAct); setTimeout(() => { const last = S.g.lines.filter((l) => /HAIL MARY/.test(l)).pop(); if (last) toast(last.replace(/^\[T\d+\] /, '')); }, 60); } });
  $('cycleBtn').disabled = !mine || !me.hand.length;
  $('cycleBtn').onclick = () => pickCard('Discard one card, draw a replacement', me.hand, (c) => resolveMain({ t: 'cycle', c }));
  $('passBtn').disabled = !mine; $('passBtn').onclick = () => resolveMain({ t: 'pass' });
  $('feed').innerHTML = g.lines.slice(-3).map((l) => `<div>${esc(l)}</div>`).join('');
  $('log').innerHTML = g.lines.map((l) => `<div>${esc(l)}</div>`).join(''); $('log').scrollTop = $('log').scrollHeight;
}
</script>
