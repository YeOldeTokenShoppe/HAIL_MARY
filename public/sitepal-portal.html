<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SitePal portal</title>
  <style>
    html, body { margin: 0; padding: 0; background: #af9682; overflow: hidden; }
    #stage { width: 600px; height: 800px; }

    /*
      THE BEIGE IS OURS, NOT SITEPAL'S. The scenes are authored with a
      TRANSPARENT background, so every pixel behind the character in this
      document is #af9682 from the rule above — a parchment tone that suits the
      surfaces which MIRROR this canvas (/main's portraits, TalkShowScene's face
      projection onto a mesh, and the same colour is set by hand on /vigil's
      canvas). Opaque is what those want: they are painting the result onto
      something and an alpha hole would show the mesh through his cheek.

      A surface that DISPLAYS this frame directly wants the opposite — the beige
      becomes a visible block behind a cutout character. So it is a parameter
      with the old value as the default: ?bg=transparent for the press floor's
      Virgil tile, nothing at all for everybody else.
    */


    /*
      WHERE THE PLAYER ACTUALLY LANDS, which is not in #stage.

      AC_VHost_Embed takes no container argument in the call below, so once the
      document is loaded it APPENDS its player to the body — `_html5Player` ends
      up a SIBLING of #stage, not a child. #stage still reserves 600x800 of flow
      above it, so the canvas is laid out at y=800: entirely below the visible
      area of a document whose body is overflow:hidden. Measured 2026-08-03:
      canvas rect {x:0, y:800, w:600, h:450}.

      IT WAS INVISIBLE UNTIL SOMETHING DISPLAYED THIS FRAME. /main never looks at
      where the canvas sits — it mirrors it by PIXELS into its own canvas, and a
      drawImage source does not care about layout. The press floor's Virgil tile
      shows the iframe itself, and so is the first surface for which the player
      being parked off the bottom of its own document means a blank beige box.

      Both are pinned to the origin rather than reparenting the player: moving a
      node SitePal owns is how you find out which of its internals cached the
      old one. Note the real canvas is 600x450, not 600x800 — anything framing
      this document should crop to that.
    */
    #stage { position: absolute; left: 0; top: 0; }
    #_html5Player { position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
<!--
  ONE SitePal character, alone in its own document.

  WHY THIS FILE EXISTS: every SitePal embed in a document fights over the same
  globals and the same `_html5Player` DOM id, and AC_VHost_Embed remembers a
  single container after its first init. Mounting several portals in one React
  tree therefore collapses them ALL into the first container — proven
  2026-07-15 (distinct refs returned, selectPortal present, yet only one player
  and one canvas ever existed). An iframe per character sidesteps that at the
  root: separate document, separate globals, its own uniquely-named player div.

  EMBED TIMING IS LOAD-BEARING. AC_VHost_Embed branches on document.readyState:
  while the parser is open it uses document.write; once loaded it appends to the
  DOM. Embedding at PARSE time here is fatal — the write lands after the parser
  closes, so it implicitly document.open()s and WIPES this document (every
  <script> vanishes, readyState sticks on "loading" forever, no player). So we
  wait for window load and embed into #stage, which is exactly the append path
  the rest of the app already relies on.

  The parent drives a character by reaching into its frame (same-origin):
    frame.contentWindow.sayText(text, voiceId, lang, engine)
  No selectPortal needed — one player per document, nothing to disambiguate.

  Query params: ?acc=<account>&scene=<sceneId>&embed=<embedToken>[&bg=<css colour>]
-->
<div id="stage"></div>

<script type="text/javascript">
  var Q = new URLSearchParams(window.location.search);
  var ACC = parseInt(Q.get("acc") || "9308752", 10);
  var SCENE = parseInt(Q.get("scene"), 10);
  var EMBED = Q.get("embed") || "";

  /* Applied before the player exists so there is never a beige frame to flash.
     Restricted to a safe shape — this value lands in a style property and the
     query string is not a trusted input just because we normally write it. */
  var BG = Q.get("bg");
  if (BG && /^(transparent|#[0-9a-f]{3,8}|[a-z]+)$/i.test(BG)) {
    document.documentElement.style.background = BG;
    document.addEventListener("DOMContentLoaded", function () {
      document.body.style.background = BG;
    });
  }

  // Force preserveDrawingBuffer so the parent can drawImage() this canvas every
  // frame — without it the buffer is cleared after compositing and reads blank.
  var _origGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (type === "webgl" || type === "webgl2" || type === "experimental-webgl") {
      attrs = Object.assign({}, attrs, { preserveDrawingBuffer: true });
    }
    return _origGetContext.call(this, type, attrs);
  };

  window.__portalReady = false;
  window.__portalError = null;

  function tell(type, extra) {
    try {
      window.parent.postMessage(
        Object.assign({ type: type, scene: SCENE }, extra || {}),
        window.location.origin
      );
    } catch (e) {}
  }

  // Which scene this frame is CURRENTLY showing. On phones one frame is
  // spotlighted and loadSceneByID-swapped between characters (three live
  // players OOM-crash iOS), so the parent must know who is in the frame right
  // now — not just which scene it booted with.
  window.__portalScene = SCENE;

  window.vh_sceneLoaded = function (index, portal, errCode, errMsg) {
    window.__portalReady = true;
    if (errCode) window.__portalError = errCode + ": " + errMsg;
    // Stay silent until the parent explicitly asks this character to speak.
    try { window.setPlayerVolume(0); } catch (e) {}
    // setStatus(interruptMode, progressInterval, gazeSpeed, displayControls, enableLog)
    // gazeSpeed 1 = medium: she turns toward whoever is whispering at a pace
    // that reads as attention rather than a snap (0=slow is too sluggish to
    // land inside a single adviser's turn, 2=fast reads as a flinch).
    // displayControls 0 hides SitePal's on-scene play overlay.
    try { window.setStatus(1, 0, 1, 0, 0); } catch (e) {}
    // Fires on the FIRST load AND on every loadSceneByID swap — the parent
    // awaits this before handing the new character a line.
    tell("sitepal-portal-ready", { errCode: errCode, scene: window.__portalScene });
  };

  // Talk events let the parent run a conversation: speak, await the end, hand
  // off to the next character. Each frame reports only its OWN character.
  window.vh_talkStarted = function () { tell("sitepal-portal-talk-started"); };
  window.vh_talkEnded = function () { tell("sitepal-portal-talk-ended"); };

  function embedNow() {
    if (typeof window.AC_VHost_Embed !== "function") return;
    // (accountID, height, width, bgcolor, firstscene, controls, sceneId, sl,
    //  load, context, embedId, version, responsive) — same shape /main uses.
    window.__portal = window.AC_VHost_Embed(
      ACC, 600, 800, "", 1, 0, SCENE, 0, 1, 0, EMBED, 0, 1
    );
  }

  // Load the embed functions, then embed only once the document is fully
  // loaded (see the timing note above).
  var s = document.createElement("script");
  s.type = "text/javascript";
  s.src = "//vhss-d.oddcast.com/vhost_embed_functions_v4.php?acc=9308752&js=0";
  s.onload = function () {
    if (document.readyState === "complete") embedNow();
    else window.addEventListener("load", embedNow);
  };
  document.head.appendChild(s);
</script>
</body>
</html>
