<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 710" width="512" height="710">
<!-- R-cana frame 3 (the dark-enamel frame mocked up 2026-11-16) — METAL MASK: Trader · trim (outer border, art hairline, text-panel border).
     White = metal, transparent = everything else. Card box 512 x 710 (the 1027:1424 card aspect), so it scales to any size.
     Use as a CSS mask over a foil layer:  mask-image: url(/TCG/frames/rcana-frame3-trader-trim.svg); mask-size: 100% 100%;
     Numerals, the coloured plate, the die and the art are deliberately NOT in the mask. -->
<defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="710">
<rect width="512" height="710" fill="#000"/>
<rect x="0" y="0" width="512" height="710" rx="24" fill="#fff"/>
<rect x="5" y="5" width="502" height="700" rx="19" fill="#000"/>
<rect x="15" y="15" width="482" height="472" rx="11" fill="none" stroke="#fff" stroke-width="2"/>
<rect x="28" y="436" width="456" height="158" rx="12" fill="#000"/>
<rect x="29" y="437" width="454" height="156" rx="11" fill="none" stroke="#fff" stroke-width="2"/>
<g transform="translate(4,0) scale(0.96,0.957)"><path d="M50 6 C50 6 16 46 16 72 A34 34 0 0 0 84 72 C84 46 50 6 50 6 Z" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/></g>
<g transform="translate(388,0)"><polygon points="8,16 116,16 116,96 40,96 8,66" fill="#000"/><ellipse cx="66" cy="20" rx="30" ry="8" fill="none" stroke="#000" stroke-width="10"/></g>
</mask></defs>
<rect width="512" height="710" fill="#fff" mask="url(#m)"/>
</svg>
