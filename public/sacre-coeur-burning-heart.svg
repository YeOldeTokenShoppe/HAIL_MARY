<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title desc">
  <title id="title">Burning Sacred Heart</title>
  <desc id="desc">A stylized Sacre Coeur heart with flames, a cross, crown of thorns, wound, and golden rays.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="54%">
      <stop offset="0%" stop-color="#ffe7a6" stop-opacity=".95"/>
      <stop offset="48%" stop-color="#f8b84e" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#7d2f23" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heart" x1="170" x2="342" y1="226" y2="478" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5b4f"/>
      <stop offset="48%" stop-color="#cf1f32"/>
      <stop offset="100%" stop-color="#7e0e25"/>
    </linearGradient>

    <radialGradient id="heartLight" cx="40%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#ffb6a8" stop-opacity=".8"/>
      <stop offset="54%" stop-color="#ff4f53" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#600819" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flameOuter" x1="196" x2="316" y1="70" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff3a5"/>
      <stop offset="34%" stop-color="#ffb434"/>
      <stop offset="72%" stop-color="#f05a26"/>
      <stop offset="100%" stop-color="#9a1730"/>
    </linearGradient>

    <linearGradient id="flameInner" x1="236" x2="286" y1="112" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="58%" stop-color="#ffc94e"/>
      <stop offset="100%" stop-color="#ff7134"/>
    </linearGradient>

    <linearGradient id="gold" x1="188" x2="340" y1="126" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1b5"/>
      <stop offset="45%" stop-color="#d89529"/>
      <stop offset="100%" stop-color="#8a4e16"/>
    </linearGradient>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 .72 0 0 .44  0 0 .28 0 .1  0 0 0 .7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#300713" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="512" height="640" fill="#15070c"/>
  <circle cx="256" cy="326" r="246" fill="url(#halo)"/>

  <g stroke="#f5c768" stroke-linecap="round" stroke-opacity=".72">
    <path d="M256 36v94" stroke-width="5"/>
    <path d="M256 506v84" stroke-width="5"/>
    <path d="M72 316h88" stroke-width="5"/>
    <path d="M352 316h88" stroke-width="5"/>
    <path d="M126 132l65 71" stroke-width="4"/>
    <path d="M386 132l-65 71" stroke-width="4"/>
    <path d="M117 494l68-72" stroke-width="4"/>
    <path d="M395 494l-68-72" stroke-width="4"/>
    <path d="M52 218l100 34" stroke-width="3"/>
    <path d="M460 218l-100 34" stroke-width="3"/>
    <path d="M76 420l86-36" stroke-width="3"/>
    <path d="M436 420l-86-36" stroke-width="3"/>
  </g>

  <g filter="url(#softGlow)">
    <path fill="#dc2b3f" d="M167 259c-4-24 8-47 30-55-15-23-5-50 22-62-8-29 9-55 36-71-2 39 18 54 34 31 9-13 13-28 32-42-7 35 6 52 25 66 18 13 29 30 25 51 21-5 38 11 36 33 23 3 39 22 36 49H167Z"/>
    <path fill="#ef6b5e" opacity=".42" d="M203 244c8-20 24-31 45-31-9-21-2-38 18-51-2 32 23 42 39 20 8 16 20 27 38 31-10 6-16 16-17 31H203Z"/>
  </g>

  <g filter="url(#shadow)">
    <path fill="url(#heart)" d="M256 510c-58-58-111-105-138-157-26-51-13-113 35-133 38-16 76 2 103 42 27-40 65-58 103-42 48 20 61 82 35 133-27 52-80 99-138 157Z"/>
    <path fill="url(#heartLight)" d="M256 510c-58-58-111-105-138-157-26-51-13-113 35-133 38-16 76 2 103 42 27-40 65-58 103-42 48 20 61 82 35 133-27 52-80 99-138 157Z"/>
    <path fill="none" stroke="#ffd1bc" stroke-linecap="round" stroke-width="8" d="M146 292c8-36 39-53 70-39"/>
    <path fill="none" stroke="#5b0618" stroke-opacity=".38" stroke-linecap="round" stroke-width="9" d="M184 458c26 13 49 28 72 52 25-25 51-42 78-58"/>
  </g>

  <g fill="none" stroke="#2b180c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 329c51-40 93-24 137-5 45 20 87 31 134-13" stroke-width="11"/>
    <path d="M128 350c55-39 91-23 133-4 46 21 86 31 124-5" stroke-width="8"/>
    <path d="M158 312l-20 35m56-43l-24 52m60-44l-17 48m53-32l-13 43m49-30l-17 43m54-55l-14 50" stroke-width="5"/>
  </g>

  <g fill="#f3c45e">
    <circle cx="147" cy="348" r="5"/>
    <circle cx="187" cy="310" r="4"/>
    <circle cx="220" cy="357" r="4"/>
    <circle cx="300" cy="333" r="4"/>
    <circle cx="354" cy="335" r="5"/>
  </g>

</svg>
