<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Lady of Perpetual Profit — ASCII Decrypt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08060f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  #container {
    position: relative;
    line-height: 0;
  }
  canvas { display: block; }

  /* CRT Scanlines */
  #scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.12) 0px,
      rgba(0,0,0,0.12) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: multiply;
  }

  /* Vignette */
  #vignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
    z-index: 3;
  }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 24px;
    display: flex;
    gap: 14px;
    z-index: 10;
  }
  button {
    background: rgba(0, 245, 212, 0.08);
    border: 1px solid rgba(0, 245, 212, 0.35);
    color: #00f5d4;
    padding: 10px 28px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    text-transform: uppercase;
  }
  button:hover {
    background: rgba(0, 245, 212, 0.18);
    border-color: #00f5d4;
    box-shadow: 0 0 12px rgba(0,245,212,0.2);
  }
  button.recording {
    border-color: #ff4040;
    color: #ff4040;
    background: rgba(255,64,64,0.1);
    animation: recPulse 1s infinite;
  }
  @keyframes recPulse {
    0%,100% { box-shadow: 0 0 4px rgba(255,64,64,0.3); }
    50% { box-shadow: 0 0 16px rgba(255,64,64,0.6); }
  }
  #status {
    color: rgba(0,245,212,0.5);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 10;
  }

  /* CRT Flicker */
  @keyframes flicker {
    0% { opacity: 1; }
    3% { opacity: 0.85; }
    6% { opacity: 1; }
    7% { opacity: 0.9; }
    9% { opacity: 1; }
    50% { opacity: 1; }
    52% { opacity: 0.92; }
    53% { opacity: 1; }
    100% { opacity: 1; }
  }
  #container { animation: flicker 4s infinite; }
</style>
</head>
<body>

<div id="container">
  <canvas id="canvas"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>
</div>

<div id="controls">
  <button id="replayBtn">⟳ Replay</button>
  <button id="recordBtn">● Record WebM</button>
  <button id="screenshotBtn">◻ Screenshot</button>
</div>
<div id="status"></div>

// ═══════════ PARSE ART ═══════════
function parseArt(raw) {
  const lines = raw.split('\n');
  // Remove leading/trailing empty lines
  while (lines.length && lines[0].trim() === '') lines.shift();
  while (lines.length && lines[lines.length-1].trim() === '') lines.pop();

  // Find min indent (ignoring empty lines)
  let minIndent = Infinity;
  for (const line of lines) {
    if (line.trim() === '') continue;
    const indent = line.search(/\S/);
    if (indent >= 0 && indent < minIndent) minIndent = indent;
  }
  if (minIndent === Infinity) minIndent = 0;

  // Trim common indent and find max width
  const trimmed = lines.map(l => l.slice(minIndent));
  let maxWidth = 0;
  for (const l of trimmed) if (l.length > maxWidth) maxWidth = l.length;

  // Build grid and character list
  const grid = [];
  const chars = []; // {row, col, char, revealTime}
  for (let r = 0; r < trimmed.length; r++) {
    grid[r] = [];
    for (let c = 0; c < maxWidth; c++) {
      const ch = c < trimmed[r].length ? trimmed[r][c] : ' ';
      grid[r][c] = ch;
      if (ch !== ' ') {
        chars.push({ row: r, col: c, char: ch });
      }
    }
  }

  return { grid, chars, rows: trimmed.length, cols: maxWidth };
}

// ═══════════ INIT ═══════════
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

const art = parseArt(ASCII_ART);

// Measure char dimensions
ctx.font = FONT;
const charWidth = ctx.measureText('M').width;
const lineH = Math.floor(FONT_SIZE * LINE_HEIGHT);

// Canvas size
const canvasW = Math.ceil(art.cols * charWidth) + PADDING * 2;
const canvasH = Math.ceil(art.rows * lineH) + PADDING * 2 + 60; // +60 for title
canvas.width = canvasW;
canvas.height = canvasH;

// Assign reveal times to each character
// Pattern: top-to-bottom wave + slight radial from center + jitter
const centerRow = art.rows / 2;
const centerCol = art.cols / 2;
const maxDist = Math.sqrt(centerRow*centerRow + centerCol*centerCol);

for (const ch of art.chars) {
  const rowNorm = ch.row / art.rows; // 0..1 top to bottom
  const dx = (ch.col - centerCol) / art.cols;
  const dy = (ch.row - centerRow) / art.rows;
  const radialNorm = Math.sqrt(dx*dx + dy*dy) / 0.7; // normalized radial distance
  const jitter = Math.random() * 0.08;

  // Mix of top-down wave (70%) and radial (30%) + jitter
  ch.revealTime = 0.12 + (rowNorm * 0.65 + radialNorm * 0.10 + jitter);
  ch.revealTime = Math.min(ch.revealTime, 0.88);
}

// ═══════════ RANDOM CHAR ═══════════
function randChar() {
  return SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
}

// ═══════════ COLOR HELPERS ═══════════
function rgba(c, alphaOverride) {
  return `rgba(${c.r},${c.g},${c.b},${alphaOverride !== undefined ? alphaOverride : c.a})`;
}
function lerpColor(a, b, t) {
  return {
    r: Math.round(a.r + (b.r - a.r) * t),
    g: Math.round(a.g + (b.g - a.g) * t),
    b: Math.round(a.b + (b.b - a.b) * t),
    a: a.a + (b.a - a.a) * t
  };
}

// ═══════════ RENDER ═══════════
let progress = 0;       // 0..1 driven by GSAP
let scrambleTick = 0;   // increments to throttle random char changes
let glitchOffset = 0;   // horizontal glitch shift

// Pre-compute random char arrays for stable scramble (update every ~50ms)
let scrambleFrame = 0;
const scrambleCache = {};
function getScrambleChar(row, col) {
  const key = row * 10000 + col;
  if (!scrambleCache[key] || scrambleFrame % 3 === 0) {
    scrambleCache[key] = randChar();
  }
  return scrambleCache[key];
}

function render() {
  ctx.clearRect(0, 0, canvasW, canvasH);

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Subtle background glow at center of figure
  if (progress > 0.3) {
    const glowAlpha = Math.min((progress - 0.3) * 0.15, 0.06);
    const grd = ctx.createRadialGradient(canvasW/2, canvasH/2 - 30, 20, canvasW/2, canvasH/2 - 30, canvasH * 0.5);
    grd.addColorStop(0, `rgba(0,245,212,${glowAlpha})`);
    grd.addColorStop(1, 'rgba(0,245,212,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvasW, canvasH);
  }

  ctx.font = FONT;
  ctx.textBaseline = 'top';

  // Random glitch offset (rare)
  glitchOffset = 0;
  if (progress > 0.05 && progress < 0.85 && Math.random() < 0.015) {
    glitchOffset = (Math.random() - 0.5) * 4;
  }

  for (const ch of art.chars) {
    const x = PADDING + ch.col * charWidth + glitchOffset;
    const y = PADDING + ch.row * lineH;
    const rt = ch.revealTime;
    const transitionWindow = 0.04; // how long the transition phase lasts

    if (progress < 0.06) {
      // Phase 1: characters appearing as noise
      const appearProgress = progress / 0.06;
      const rowAppear = ch.row / art.rows;
      if (appearProgress > rowAppear * 0.8 + Math.random() * 0.2) {
        ctx.fillStyle = rgba(COL_SCRAMBLE);
        ctx.fillText(getScrambleChar(ch.row, ch.col), x, y);
      }
    } else if (progress < rt - transitionWindow) {
      // Scrambled
      ctx.fillStyle = rgba(COL_SCRAMBLE, 0.18 + Math.random() * 0.08);
      ctx.fillText(getScrambleChar(ch.row, ch.col), x, y);
    } else if (progress < rt) {
      // Transitioning — rapid cycling, brightening
      const t = (progress - (rt - transitionWindow)) / transitionWindow;
      const col = lerpColor(COL_ACTIVE, COL_FLASH, t);
      ctx.fillStyle = rgba(col);
      // Probability of showing final char increases
      ctx.fillText(Math.random() < t * t ? ch.char : randChar(), x, y);
      // Glow
      ctx.shadowColor = rgba(COL_ACTIVE, 0.5);
      ctx.shadowBlur = 6 * t;
    } else if (progress < rt + 0.03) {
      // Just revealed — flash
      const flashT = (progress - rt) / 0.03;
      const col = lerpColor(COL_FLASH, COL_FINAL, flashT);
      ctx.fillStyle = rgba(col);
      ctx.shadowColor = rgba(COL_ACTIVE, 0.4 * (1 - flashT));
      ctx.shadowBlur = 8 * (1 - flashT);
      ctx.fillText(ch.char, x, y);
    } else {
      // Settled
      ctx.fillStyle = rgba(COL_FINAL);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.fillText(ch.char, x, y);
    }

    // Reset shadow after each char
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }

  // ─── Title text at bottom ───
  if (progress > 0.88) {
    const titleAlpha = Math.min((progress - 0.88) / 0.10, 1.0);
    const titleY = PADDING + art.rows * lineH + 20;

    ctx.textAlign = 'center';
    ctx.font = `bold ${FONT_SIZE + 2}px 'Courier New', monospace`;
    ctx.fillStyle = rgba(COL_TITLE_GOLD, titleAlpha);
    ctx.shadowColor = rgba(COL_TITLE_GOLD, titleAlpha * 0.4);
    ctx.shadowBlur = 12;
    ctx.fillText('✦  Our Lady of Perpetual Profit  ✦', canvasW / 2, titleY);

    ctx.font = `${FONT_SIZE}px 'Courier New', monospace`;
    ctx.fillStyle = rgba(COL_ACTIVE, titleAlpha * 0.8);
    ctx.shadowColor = rgba(COL_ACTIVE, titleAlpha * 0.3);
    ctx.shadowBlur = 8;
    ctx.fillText('$RL80 on Base', canvasW / 2, titleY + lineH + 8);

    ctx.textAlign = 'left';
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }
}

// ═══════════ ANIMATION TIMELINE ═══════════
let tl;

function playAnimation() {
  if (tl) tl.kill();
  progress = 0;
  scrambleFrame = 0;

  const proxy = { p: 0 };
  tl = gsap.timeline({
    onUpdate: () => {
      progress = proxy.p;
      scrambleFrame++;
      // Regenerate scramble chars periodically
      if (scrambleFrame % 3 === 0) {
        for (const key in scrambleCache) {
          if (Math.random() < 0.4) scrambleCache[key] = randChar();
        }
      }
      render();
    },
    onComplete: () => {
      progress = 1;
      render();
      status.textContent = 'Animation complete';
    }
  });

  tl.to(proxy, {
    p: 1,
    duration: DURATION,
    ease: 'power1.inOut'
  });
}

// ═══════════ RECORDING ═══════════
let mediaRecorder = null;
let recordedChunks = [];

function startRecording() {
  const recordBtn = document.getElementById('recordBtn');

  // Hide controls during recording
  document.getElementById('controls').style.opacity = '0';
  document.getElementById('controls').style.pointerEvents = 'none';
  status.textContent = '';

  const stream = canvas.captureStream(60);
  recordedChunks = [];

  mediaRecorder = new MediaRecorder(stream, {
    mimeType: 'video/webm;codecs=vp9',
    videoBitsPerSecond: 8000000
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rl80-ascii-decrypt.webm';
    a.click();
    URL.revokeObjectURL(url);

    document.getElementById('controls').style.opacity = '1';
    document.getElementById('controls').style.pointerEvents = 'auto';
    recordBtn.classList.remove('recording');
    recordBtn.textContent = '● Record WebM';
    status.textContent = 'Video saved!';
  };

  recordBtn.classList.add('recording');
  recordBtn.textContent = '● Recording...';

  // Start recording, then play animation
  mediaRecorder.start();

  // Small delay to ensure first frame is captured
  setTimeout(() => {
    playAnimation();
    // Stop recording after animation + small buffer
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }, (DURATION + 0.8) * 1000);
  }, 200);
}

function takeScreenshot() {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'rl80-ascii-art.png';
  a.click();
  status.textContent = 'Screenshot saved!';
}

// ═══════════ EVENT LISTENERS ═══════════
document.getElementById('replayBtn').addEventListener('click', playAnimation);
document.getElementById('recordBtn').addEventListener('click', startRecording);
document.getElementById('screenshotBtn').addEventListener('click', takeScreenshot);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); playAnimation(); }
  if (e.code === 'KeyR') startRecording();
  if (e.code === 'KeyS') takeScreenshot();
});

// ═══════════ START ═══════════
status.textContent = 'Space = replay  |  R = record  |  S = screenshot';
// Initial draw then auto-play
render();
setTimeout(playAnimation, 500);

</script>
