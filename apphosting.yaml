    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_CDP_PROJECT_ID
    secret: NEXT_PUBLIC_CDP_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
