# Railway Configuration for RL80 - Our Lady of Perpetual Profit

[build]
builder = "dockerfile"
dockerfilePath = "./Dockerfile"

[deploy]
# Disable health checks - ElizaOS doesn't have /health by default
# healthcheckPath = "/health"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 3000
